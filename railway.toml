[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Healthcheck KAPALI: worker bot + gömülü Ollama ilk saniyelerde
# "service unavailable" ile deploy'u düşürmesin.
# HTTP /health yine var; istersen sonra tekrar açarsın.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
