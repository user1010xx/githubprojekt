# Bot only (Grok API — no local Ollama)
services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/bot.db
      PORT: "8080"
      GROK_MODEL: ${GROK_MODEL:-grok-4.3}
      GROK_BASE_URL: ${GROK_BASE_URL:-https://api.x.ai/v1}
    ports:
      - "8080:8080"
    volumes:
      - bot_data:/app/data
    restart: unless-stopped

volumes:
  bot_data:
